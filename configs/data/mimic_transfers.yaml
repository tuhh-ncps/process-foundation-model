# MIMIC-IV Story A: patient flow through care units (one hospital admission = one trace).
# Build the CSV first (on the cluster, where the data lives):
#   apptainer exec pmfoundation.sif python scripts/build_mimic_log.py \
#       --mimic data/raw/mimic-iv-v3.1/physionet.org/files/mimiciv/3.1 \
#       --out   data/raw/mimic_transfers.csv
# Canonical case_id/activity/timestamp columns -> the CSV reader needs no mapping.
vocab_logs:
  - path: ${paths.data_dir}/mimic_transfers.csv
    format: csv
train_logs:
  - path: ${paths.data_dir}/mimic_transfers.csv
    format: csv
strip_to_control_flow: true
min_trace_len: 2
split: [0.70, 0.15, 0.15]
batch_size: 96              # PER-GPU under DDP (global = batch_size x world_size; scale LR)
length_bucketing: true      # care-unit traces are short but variable; keeps padding tight
