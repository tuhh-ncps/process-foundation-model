# Helpdesk (Italian software-company ticket process) — small IT service-management log, 9 activities
# (numeric ActivityIDs, so no semantic outcome labeler; use it for next_activity / time transfer).
# A genuinely different domain from loans, travel, and hospital — good HELD-OUT / pretraining domain.
# The header was canonicalized to case_id/activity/timestamp so a bare `format: csv` config just works.
vocab_logs:
  - path: ${paths.data_dir}/helpdesk.csv
    format: csv
train_logs:
  - path: ${paths.data_dir}/helpdesk.csv
    format: csv
strip_to_control_flow: true
min_trace_len: 2
split: [0.70, 0.15, 0.15]
batch_size: 96
length_bucketing: true
