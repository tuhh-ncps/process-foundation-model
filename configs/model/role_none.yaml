# Ablation: NO role-embedding channel at all. role_dim=0 makes
# TraceBackbone.role_encoder None and EventEmbedding.has_role False, and it also
# deactivates ar.role_contrast_weight (which requires model.role_dim > 0).
# Identical to role_gin15.yaml in every other respect, so it isolates the role
# channel itself rather than the fingerprint or the GIN.
d_model: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_seq_len: 64
activity_embedding_dim: 128
attribute_embedding_dim: 32
position: rope
id_dropout: 0.5
aggregator: sum
role_arch: gin
role_dim: 0
role_layers: 1
role_feature_subset: all
