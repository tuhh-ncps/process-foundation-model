# V3: V2 gated time encoder + Fourier features on the two continuous monotonic time columns
# (z_log_delta, z_log_elapsed) with bands [1,2,4,8]. Cyclic (hour/dow) and binary
# (is_weekend/is_business_hour) features are left alone. Same as transformer_small_timegate
# otherwise. Fourier is computed inside the TimeEncoder, so the 12 base features are unchanged.
d_model: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_seq_len: 64
activity_embedding_dim: 128
attribute_embedding_dim: 32
position: learned
time_encoder: fourier      # none | mlp (V1) | gated (V2) | fourier (V3)
fourier_bands: [1, 2, 4, 8]  # start small — process mining, not a synthesizer
