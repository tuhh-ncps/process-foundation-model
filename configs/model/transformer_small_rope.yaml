# Same capacity as transformer_small, but RoPE positions + UNBOUNDED length (no truncation).
# max_seq_len: 0 means traces are never cut to a fixed window; pair with length_bucketing
# (on by default) to keep padding tight on the resulting variable-length batches.
d_model: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_seq_len: 0             # unbounded (RoPE handles any length)
activity_embedding_dim: 128
attribute_embedding_dim: 32
position: rope
