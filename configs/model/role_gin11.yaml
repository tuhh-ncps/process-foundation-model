# Role-embedding ablation candidate: GIN-11 (directed sum-GIN, depth-1, 11 PCA-selected feats).
# Structural-only e(a) — NO name/stats/ctx fusion (role_arch=gin -> RoleEmbedder). Same transformer
# backbone across all 4 candidates. Used for Phase-2 (backbone) with a frozen Phase-1 role encoder.
d_model: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_seq_len: 64
activity_embedding_dim: 128
attribute_embedding_dim: 32
position: rope
id_dropout: 0.5
aggregator: sum
# --- role embedding candidate ---
role_arch: gin                # raw | mlp | gin
role_dim: 64
role_layers: 1                # depth-1 (ablation: deeper over-smooths on small DFGs)
role_feature_subset: eleven   # 11 strongest feats (PCA backward-elimination; 87% reconstruction)
