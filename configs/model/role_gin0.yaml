# Role-embedding ablation candidate: GIN-0 (directed sum-GIN, depth-1, NO fingerprint features).
# Featureless control - the GIN is fed a constant, so e(a) encodes ONLY DFG topology. Isolates how
# much of the other candidates' downstream performance comes from the 15-dim fingerprint vs the
# graph structure alone. Same transformer backbone / Phase-2 setup as the other 4 candidates.
d_model: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_seq_len: 64
activity_embedding_dim: 128
attribute_embedding_dim: 32
position: rope
id_dropout: 0.5
aggregator: sum
# --- role embedding candidate ---
role_arch: gin
role_dim: 64
role_layers: 1                # depth-1, matching the other candidates
role_feature_subset: none     # <- featureless: constant input, topology only
