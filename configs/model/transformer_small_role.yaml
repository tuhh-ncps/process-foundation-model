d_model: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_seq_len: 64            # 0 for unbounded length (needs position: rope)
activity_embedding_dim: 128
attribute_embedding_dim: 32
position: learned          # learned | rope
# --- role channel: candidate-record ActivityEncoder (fingerprints -> directed GIN) ---
# Hybrid input ID (+) e(a_i); next-activity becomes open-vocab candidate matching over
# the tied e(c) table. Fingerprints are fit on the TRAIN split only (data/roles.py).
role_dim: 64               # role-space width (0 disables the whole channel)
role_layers: 2             # directed GIN message-passing layers on the DFG
id_dropout: 0.0            # train-time prob of UNK-masking the ID channel so the model must use
                           # the role channel -> makes the role space load-bearing / transferable.
                           # 0 = off (default). Try 0.5 for cross-domain transfer experiments.
