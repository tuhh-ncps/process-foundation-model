# V5: temporal attention bias — a learnable per-head bias over the bucketed log real-time gap
# log1p(|t_i - t_j|), ADDED to RoPE attention scores (relative index via RoPE + relative REAL
# time via the bias). Requires position: rope. Input time encoder left at baseline (none), so
# this isolates the attention-side change. Bias table inits to zero (== plain RoPE at start).
d_model: 256
n_layers: 6
n_heads: 8
ffn_dim: 1024
dropout: 0.1
max_seq_len: 0             # uncapped (RoPE)
activity_embedding_dim: 128
attribute_embedding_dim: 32
position: rope
time_encoder: none
temporal_bias: true
temporal_bias_buckets: 32   # start simple — 32 learnable log-gap buckets, per head
