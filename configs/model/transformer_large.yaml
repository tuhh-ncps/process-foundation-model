# A bigger backbone (scale up when you have the GPUs). For truly large models train with
# trainer=fsdp and consider position: rope + max_seq_len: 0.
d_model: 1024
n_layers: 24
n_heads: 16
ffn_dim: 4096
dropout: 0.1
max_seq_len: 0
activity_embedding_dim: 256
attribute_embedding_dim: 64
position: rope
