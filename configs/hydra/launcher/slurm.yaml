# @package hydra.launcher
# Submits the SAME run to Slurm — no hand-written sbatch. Needs -m. Override per cluster:
#   hydra.launcher.partition=gpu hydra.launcher.nodes=2 hydra.launcher.gpus_per_node=1
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
submitit_folder: ${paths.output_dir}/submitit/%j
timeout_min: 240
nodes: 2
tasks_per_node: 1          # = GPUs per node (one process per GPU)
gpus_per_node: 1
cpus_per_task: 8
mem_gb: 64
partition: gpu             # <-- your partition
account: null              # <-- your allocation
setup:
  - "export MASTER_PORT=29500"
  # - "export NCCL_SOCKET_IFNAME=ib0"   # if your fabric needs it
# additional_parameters: {gres: "gpu:1"}
