# For models too big for one GPU: shards params/grads/optimizer. Pair with a larger model
# and activation checkpointing. (Overkill for the current 4.8M backbone — for future scale-up.)
max_epochs: 1
accelerator: gpu
precision: bf16-mixed
strategy: fsdp             # or deepspeed_stage_3
gradient_clip_val: 1.0
accumulate_grad_batches: 4
